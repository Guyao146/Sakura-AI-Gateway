name: Build and publish Sakura-AI-Gateway

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  NODE_RUNTIME_VERSION: '20.20.2'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/guyao146/sakura-ai-gateway:${{ github.ref_name }}
            ghcr.io/guyao146/sakura-ai-gateway:latest
          labels: |
            org.opencontainers.image.title=Sakura-AI-Gateway
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $electronVersion = node -p "require('./clients/electron/package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Git tag does not match package.json: v$version" }
          if ($electronVersion -ne $version) { throw "Electron version does not match root package.json" }

      - name: Prepare gateway files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force clients/electron/gateway, clients/webview2/gateway, clients/webview2/runtime | Out-Null
          git archive --format=tar HEAD -- README.md LICENSE LICENSING.md package.json public src wiki | tar -xf - -C clients/electron/gateway
          git archive --format=tar HEAD -- README.md LICENSE LICENSING.md package.json public src wiki | tar -xf - -C clients/webview2/gateway
          if (-not (Test-Path clients/electron/gateway/src/server.js)) { throw 'Electron gateway source was not staged at gateway/src/server.js' }
          if (-not (Test-Path clients/webview2/gateway/src/server.js)) { throw 'WebView2 gateway source was not staged at gateway/src/server.js' }
          if (-not (Test-Path clients/electron/gateway/public/index.html)) { throw 'Electron gateway public files were not staged' }
          if (-not (Test-Path clients/webview2/gateway/public/index.html)) { throw 'WebView2 gateway public files were not staged' }

      - name: Download official Node.js runtime for WebView2
        shell: pwsh
        run: |
          $version = $env:NODE_RUNTIME_VERSION
          $zip = "node-v$version-win-x64.zip"
          $url = "https://nodejs.org/dist/v$version/$zip"
          $shaLine = (Invoke-WebRequest -UseBasicParsing "https://nodejs.org/dist/v$version/SHASUMS256.txt").Content -split "`n" | Where-Object { $_ -match " $zip$" }
          if (-not $shaLine) { throw "Unable to find Node.js checksum" }
          $expected = ($shaLine -split '\s+')[0].ToLowerInvariant()
          $archive = Join-Path $env:RUNNER_TEMP $zip
          Invoke-WebRequest -UseBasicParsing $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Node.js runtime checksum mismatch" }
          $extract = Join-Path $env:RUNNER_TEMP "node-runtime"
          Expand-Archive $archive -DestinationPath $extract -Force
          Copy-Item (Join-Path $extract "node-v$version-win-x64/node.exe") clients/webview2/runtime/node.exe -Force

      - name: Build Edge WebView2 client
        shell: pwsh
        run: |
          dotnet restore clients/webview2/Sakura-AI-Gateway.WebView2.csproj
          dotnet publish clients/webview2/Sakura-AI-Gateway.WebView2.csproj -c Release -r win-x64 --self-contained true -o clients/webview2/publish
          $version = node -p "require('./package.json').version"
          $stage = Join-Path $env:RUNNER_TEMP "Sakura-AI-Gateway-$version-WebView2-win-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item clients/webview2/publish/* $stage -Recurse -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "Sakura-AI-Gateway-$version-WebView2-win-x64.zip" -CompressionLevel Optimal

      - name: Build Electron client
        shell: pwsh
        working-directory: clients/electron
        run: |
          npm install --no-audit --no-fund --fetch-retries=3
          npm run dist

      - name: Build Node gateway upgrade archive
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          git archive --format=tar --prefix="Sakura-AI-Gateway-v$version/" HEAD | tar -xf - -C $env:RUNNER_TEMP
          tar -czf "Sakura-AI-Gateway-v$version.tar.gz" -C $env:RUNNER_TEMP "Sakura-AI-Gateway-v$version"

      - name: Publish one GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $webView2 = "Sakura-AI-Gateway-$version-WebView2-win-x64.zip"
          $gateway = "Sakura-AI-Gateway-v$version.tar.gz"
          $electronAssets = @(Get-ChildItem clients/electron/dist -Filter "Sakura-AI-Gateway-$version-Electron-*.exe" | Select-Object -ExpandProperty FullName)
          $setup = $electronAssets | Where-Object { $_ -match '-Setup\.exe$' } | Select-Object -First 1
          $portable = $electronAssets | Where-Object { $_ -match '-Portable\.exe$' } | Select-Object -First 1
          $assets = @($webView2, $setup, $portable, $gateway)
          foreach ($asset in $assets) { if ([string]::IsNullOrWhiteSpace($asset) -or -not (Test-Path $asset)) { throw "Missing release asset: $asset" } }
          gh release create "${{ github.ref_name }}" $assets --repo "${{ github.repository }}" --title "Sakura-AI-Gateway $version" --generate-notes