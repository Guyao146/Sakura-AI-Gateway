<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sakura-AI-Gateway · Wiki</title>
<script src="assets/marked.min.js"></script>
<style>
:root{--accent:#2b6cb0;--bg:#f6f7f9;--fg:#1f2430;--border:#dde2ea;--code-bg:#eef1f5}
*{box-sizing:border-box}
body{margin:0;font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg)}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--border)}
header h1{font-size:16px;margin:0}
header .crumb{color:#6b7280;font-size:13px}
.layout{display:flex;min-height:calc(100vh - 49px)}
nav#sidebar{width:230px;flex:none;border-right:1px solid var(--border);background:#fff;padding:12px 8px;position:sticky;top:49px;height:calc(100vh - 49px);overflow:auto}
nav#sidebar a{display:block;padding:8px 12px;margin:2px 0;border-radius:6px;color:var(--fg);text-decoration:none;font-size:14px}
nav#sidebar a:hover{background:#f0f3f7}
nav#sidebar a.active{background:var(--accent);color:#fff}
main{flex:1;min-width:0;padding:24px 40px;background:#fff;overflow-x:auto}
main h1{border-bottom:2px solid var(--accent);padding-bottom:8px}
main h2{border-bottom:1px solid var(--border);padding-bottom:6px;margin-top:28px}
pre{background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:12px;overflow:auto}
code{background:var(--code-bg);border-radius:4px;padding:1px 5px;font-family:Consolas,monospace;font-size:13px}
pre code{background:none;padding:0}
table{border-collapse:collapse;width:100%;margin:12px 0}
th,td{border:1px solid var(--border);padding:6px 10px;text-align:left}
th{background:#f0f3f7}
blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:#f8fafc;color:#374151}
a{color:var(--accent)}
img{max-width:100%}
.hint{color:#6b7280}
@media(max-width:820px){.layout{flex-direction:column}nav#sidebar{width:100%;position:static;height:auto;display:flex;flex-wrap:wrap}nav#sidebar a{width:auto}}
</style>
</head>
<body>
<header><h1>📚 Sakura-AI-Gateway · Wiki</h1><span class="crumb" id="crumb"></span></header>
<div class="layout">
<nav id="sidebar"></nav>
<main id="content"><p class="hint">正在加载…</p></main>
</div>
<script>
const PAGES=[['index.md','首页'],['architecture.md','架构与模块'],['api.md','接口参考'],['integration.md','第三方接入'],['routing.md','模型路由与轮询'],['metrics.md','指标与请求日志'],['security.md','认证与安全'],['deployment.md','部署与配置'],['migration.md','名称与数据迁移'],['development.md','开发与测试']];
const sidebar=document.getElementById('sidebar'),content=document.getElementById('content'),crumb=document.getElementById('crumb');
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function scrollTopAll(){
  if('scrollRestoration' in history)history.scrollRestoration='manual';
  window.scrollTo(0,0);
  content.scrollTop=0;
}
function bindLinks(){
  content.querySelectorAll('a').forEach(a=>{
    const href=a.getAttribute('href')||'';
    if(href.startsWith('#'))return;
    if(/^[a-z][a-z0-9+.-]*:/i.test(href))return;            // 外部绝对 URL
    if(!PAGES.some(p=>p[0]===href))return;                  // 非 wiki 内部页
    a.addEventListener('click',ev=>{ev.preventDefault();navigate(href);});
  });
}
async function load(file){
  const cur=sidebar.querySelector('a.active');if(cur)cur.classList.remove('active');
  const link=Array.from(sidebar.querySelectorAll('a')).find(a=>a.dataset.file===file);if(link)link.classList.add('active');
  try{
    const res=await fetch(file);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const md=await res.text();
    content.innerHTML=marked.parse(md);
    const title=md.match(/^#\s+(.+)$/m);
    document.title=(title?title[1].trim()+' · ':'')+'Sakura-AI-Gateway · Wiki';
    const name=PAGES.find(p=>p[0]===file);crumb.textContent=name?name[1]:file;
    bindLinks();
    scrollTopAll();   // 关键：每次切页强制滚回顶部
  }catch(e){
    content.innerHTML='<p class="hint">无法加载 <code>'+esc(file)+'</code>：'+esc(e.message)+'（请通过 http:// 方式访问本页，而不是 file:// 直接双击打开）</p>';
  }
}
function navigate(file){history.pushState({file},'', '#'+file);load(file);}
window.addEventListener('popstate',e=>{load(e.state?e.state.file:(location.hash?location.hash.slice(1):'index.md'));});
PAGES.forEach(([f,t])=>{const a=document.createElement('a');a.href='#'+f;a.textContent=t;a.dataset.file=f;sidebar.appendChild(a);});
sidebar.addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();navigate(a.dataset.file);}});
scrollTopAll();
load(location.hash?location.hash.slice(1):'index.md');
</script>
</body>
</html>
